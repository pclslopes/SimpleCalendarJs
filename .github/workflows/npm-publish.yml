name: Publish to NPM

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags (v1.0.0, v1.2.3, etc.)
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci --include=dev
        
      - name: Build project
        run: npm run build
          
      - name: Verify package files
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"
          echo "Verifying required files exist:"
          ls -la dist/simple-calendar-js.min.js
          ls -la dist/simple-calendar-js.min.css
          ls -la LICENSE
          ls -la README.md
        
      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            SimpleCalendarJs Release ${{ github.ref_name }}
            
            ## What's Changed
            - Updated to version ${{ github.ref_name }}
            
            ## Installation
            ```bash
            npm install simple-calendar-js
            ```
          draft: false
          prerelease: false