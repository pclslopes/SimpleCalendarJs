<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleCalendarJs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Geist+Mono:wght@100..900&family=Handlee&family=Source+Code+Pro:wght@300&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
   
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/SimpleCalendarJs.css" rel="stylesheet">

    <script src="js/darkmode.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="images/calendar-logo.svg" width="40" height="40" class="me-2" alt="Logo">
                <strong class="text-secondary geist-mono-600">SimpleCalendarJs</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="index.html" class="nav-link">Examples</a></li>
                    <li class="nav-item"><a class="nav-link" href="#calendar">Demo</a></li>
                    <li class="nav-item"><a class="nav-link" href="docs.html">Docs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="text-center mb-4">
            <h1 class="display-5">SimpleCalendarJs Examples</h1>
            <p class="lead">Interactive calendar component demonstrations</p>
        </div>

        <div class="row">
            <div class="col-md-8 mb-8">
                <div class="mb-3 text-center">
                    <button id="calendar-theme-test" class="btn btn-outline-info">
                        <i class="fas fa-palette"></i> Test Calendar Themes
                    </button>
                </div>
                <div id='calendar'></div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header text-center">
                        <h5>Calendar Properties</h5>
                        <small class="text-muted">Toggle features to see changes</small>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showBackground">
                                <label class="form-check-label" for="showBackground">Show Background</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showTimeInEvent" checked>
                                <label class="form-check-label" for="showTimeInEvent">Show Time in Events</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="useShortDays">
                                <label class="form-check-label" for="useShortDays">Use Short Day Names</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showDayAsAllDayEvents">
                                <label class="form-check-label" for="showDayAsAllDayEvents">Day View as All-Day Events</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="eventBorder">
                                <label class="form-check-label" for="eventBorder">Event Borders</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showTodayButton" checked>
                                <label class="form-check-label" for="showTodayButton">Show Today Button</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showMonthYear" checked>
                                <label class="form-check-label" for="showMonthYear">Show Month/Year</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showModeButtons" checked>
                                <label class="form-check-label" for="showModeButtons">Show Mode Buttons</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showNavigation" checked>
                                <label class="form-check-label" for="showNavigation">Show Navigation Arrows</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="themeMode" class="form-label">Theme Mode</label>
                            <select class="form-select" id="themeMode">
                                <option value="auto" selected>Auto Detect</option>
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="calendarMode" class="form-label">Default View Mode</label>
                            <select class="form-select" id="calendarMode">
                                <option value="month" selected>Month</option>
                                <option value="week">Week</option>
                                <option value="day">Day</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="calendarMonthViewType" class="form-label">Month View Type</label>
                            <select class="form-select" id="calendarMonthViewType">
                                <option value="MultiDay" selected>MultiDay (Show Events)</option>
                                <option value="SingleDay">SingleDay (Event Backgrounds)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="calendarMonth" class="form-label">Month</label>
                            <select class="form-select" id="calendarMonth">
                                <option value="0">January</option>
                                <option value="1">February</option>
                                <option value="2">March</option>
                                <option value="3">April</option>
                                <option value="4">May</option>
                                <option value="5">June</option>
                                <option value="6">July</option>
                                <option value="7">August</option>
                                <option value="8">September</option>
                                <option value="9">October</option>
                                <option value="10">November</option>
                                <option value="11">December</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="calendarYear" class="form-label">Year</label>
                            <input type="number" class="form-control" id="calendarYear" min="2020" max="2030">
                        </div>
                        <div class="mb-3">
                            <button type="button" class="btn btn-primary w-100" id="todayButton">Today</button>
                        </div>
                        <div class="mb-3">
                            <label for="headerBgColor" class="form-label">Header Background</label>
                            <input type="color" class="form-control form-control-color" id="headerBgColor" value="#e3f2fd">
                        </div>
                        <div class="mb-3">
                            <label for="bodyBgColor" class="form-label">Body Background</label>
                            <input type="color" class="form-control form-control-color" id="bodyBgColor" value="#fafafa">
                        </div>
                        <div class="mb-3">
                            <label for="languagePreset" class="form-label">Language Preset</label>
                            <select class="form-select" id="languagePreset">
                                <option value="en" selected>English</option>
                                <option value="de">German (Deutsch)</option>
                                <option value="es">Spanish (Español)</option>
                                <option value="fr">French (Français)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">&copy; <span id="current-year"></span> SimpleCalendarJs. All Rights Reserved.</span>
            &nbsp;&nbsp;
            <button id="mode-toggle" class="btn btn-outline-secondary mode-toggle">
                <span id="mode-icon">🌓</span> Toggle Mode
            </button>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    
    <!-- Moment -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js'></script>

    <!-- Calendar -->
    <script src="js/SimpleCalendarJs.js"></script>

    <!-- Custom JS -->
    <script src="js/script.js"></script>
    

    
</body>
</html>
