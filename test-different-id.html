<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Different ID - SimpleCalendarJs</title>
    <link href="css/SimpleCalendarJs.css" rel="stylesheet">
</head>
<body>
    <h1>Test Calendar with Different Container ID</h1>
    
    <!-- Calendar with different ID -->
    <div id="my-custom-calendar"></div>
    
    <!-- Calendar with class instead of ID -->
    <div class="calendar-container"></div>
    
    <script src="js/SimpleCalendarJs.js"></script>
    <script>
        // Test 1: Calendar with custom ID
        const calendar1 = new SimpleCalendar('#my-custom-calendar', {
            mode: 'month',
            showBackground: false,
            data: [
                {
                    start: '2025-10-15',
                    title: 'Test Event 1',
                    backgroundColor: '#007bff'
                }
            ]
        });
        
        // Test 2: Calendar with class selector
        const calendar2 = new SimpleCalendar('.calendar-container', {
            mode: 'month', 
            showBackground: true,
            data: [
                {
                    start: '2025-10-20',
                    title: 'Test Event 2',
                    backgroundColor: '#28a745'
                }
            ]
        });
    </script>
</body>
</html>
